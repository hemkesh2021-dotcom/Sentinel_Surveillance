name: v2 portable checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10: interpreter of the v1 Jetson runtime venv; 3.12: the device's system Python.
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          # The installation package's tests compare what is packaged with earlier commits of this branch (the
          # accepted code and the previous package revisions): they need the history, not only the tip.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: sentinel config validate config/default.yaml

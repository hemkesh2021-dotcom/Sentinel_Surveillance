name: Bug report
description: Something is broken or behaving unexpectedly
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Current beta: v2.0.0-beta.1 (tester package r9). For package setup failures, use the Installation issue form.
        This tracker is public. Share short, sanitized error excerpts only; no credentials, camera addresses,
        control keys, enrollment, photos, footage or whole run folders.

  - type: input
    id: version
    attributes:
      label: Sentinel version and package revision
      description: State the release tag or commit; for the tester archive include its revision. Identify legacy v1 reports explicitly.
      placeholder: "v2.0.0-beta.1 / 2.0.0b1 / tester package r9"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the beta with these non-secret options ...
        2. Open the dashboard through the SSH tunnel ...
        3. Use this panel or control ...
        4. Observe ...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Person detection (YOLOv8 / TensorRT)
        - Tracking (ByteTrack)
        - Face recognition / identity retention (YuNet / Facenet512)
        - Scene analysis / visual Ask (LFM3-VL-2B / llama.cpp)
        - Ask from records / history
        - Dashboard / Settings / scrolling Ask
        - Telegram alerting
        - RTSP / camera input
        - Setup / installation
        - Documentation
        - Legacy v1 (Flask / LFM2-VL)
        - Other
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Hardware
      placeholder: "Jetson Orin Nano Super 8GB / x86 + RTX 3060 / etc."
    validations:
      required: true

  - type: input
    id: jetpack
    attributes:
      label: JetPack / L4T version
      placeholder: "JetPack 6.2 (L4T 36.4.3)"

  - type: input
    id: camera
    attributes:
      label: Camera model
      placeholder: "Imou Ranger S2, RTSP"

  - type: textarea
    id: command
    attributes:
      label: Exact launch command(s)
      description: Include non-secret options and whether device-artifacts / validation mode was used. Remove camera addresses, credentials, passphrases and keys.
      render: shell

  - type: textarea
    id: memory
    attributes:
      label: Memory state
      description: Output of `free -h` or `tegrastats` at the time of the bug. Many OOM issues are memory-pressure-dependent.
      render: shell

  - type: textarea
    id: logs
    attributes:
      label: Short error excerpt / traceback
      description: Relevant sanitized lines only. Do not paste complete logs or private run records.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I removed secrets, camera addresses, control keys and personal data from this report
          required: true

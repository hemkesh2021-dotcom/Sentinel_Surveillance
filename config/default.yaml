# Sentinel v2 configuration (portable foundation slice, V2-02).
# Check it with:  sentinel config validate config/default.yaml
# Durations are in seconds. Never put credentials, tokens or face data here.
config_version: 1

camera:
  # Stable identifier stored with every observation; not a URL or address.
  id: cam-1

freshness:
  # Guide chapter 6 starting targets; verify them under the actual Wi-Fi conditions.
  stale_after_s: 2.0     # video is stale after this long without a fresh frame
  offline_after_s: 10.0  # camera is offline after this long without a fresh frame
  track_expiry_s: 1.0    # a track expires this long after its last real detection

scene:
  # Scene lane (VLM) timing: proposed starting values, to be measured on the device.
  interval_s: 4.0        # between periodic scene checks, with or without people
  job_timeout_s: 8.0     # a scene job must finish within this long of its frame's arrival
  evidence_ttl_s: 10.0   # a report stays current this long after its frame (>= job_timeout_s)

hazard:
  # Fire/smoke from scene reports alone is a candidate (warning), never a critical alarm.
  confirmations: 2       # consecutive positive reports, same stream epoch
  max_gap_s: 12.0        # at most this long between their source frames
